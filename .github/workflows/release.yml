name: release

# Build prebuilt binaries for every platform and attach them to the GitHub
# Release whenever a version tag (v*) is pushed. install.sh / install.ps1 and
# `lovax update` download these assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lovax-linux-x64
            flags: "-O3 -fno-gcse -fno-crossjumping -static -s"
          - os: macos-13          # Intel runner
            asset: lovax-macos-x64
            flags: "-O3 -fno-gcse -fno-crossjumping -s"
          - os: macos-latest      # Apple Silicon runner
            asset: lovax-macos-arm64
            flags: "-O3 -fno-gcse -fno-crossjumping -s"
          - os: windows-latest
            asset: lovax-windows-x64.exe
            flags: "-O2 -s"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: |
          g++ -std=c++17 ${{ matrix.flags }} -o "${{ matrix.asset }}" src/main.cpp
          cp "${{ matrix.asset }}" lovax   # the test runner invokes ./lovax
          ./tests/run_tests.sh
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          g++ -std=c++17 ${{ matrix.flags }} -o "${{ matrix.asset }}" src/main.cpp
          certutil -hashfile "${{ matrix.asset }}" SHA256 | sed -n '2p' | tr -d ' \r' > "${{ matrix.asset }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  # Package the VS Code syntax-highlighting extension into a .vsix and ship it
  # with the release, so `.lov` files get colours in the editor too.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Package extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovax-vscode-extension
          path: editors/vscode/*.vsix

  publish:
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
