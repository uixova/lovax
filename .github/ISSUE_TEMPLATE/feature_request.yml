name: Feature request
description: Suggest a language feature, builtin, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Syntax sketch or behavior. How would it feel to use?
  - type: textarea
    id: alt
    attributes:
      label: Alternatives / prior art
      description: How do other languages (Python, Lua, ...) handle this?
